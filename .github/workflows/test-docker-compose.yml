name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
permissions: {}

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer redis celery-worker celery-beat
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - name: Test Celery worker and Redis broker
        run: docker compose exec -T backend python -c "from app.core.celery import celery_app; result = celery_app.send_task('runtime.ping', args=['compose-ping']); assert result.get(timeout=10) == 'compose-ping'"
      - run: docker compose down -v --remove-orphans
